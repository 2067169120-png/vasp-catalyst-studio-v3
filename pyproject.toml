[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vcstudio"
dynamic = ["version"]
description = "VASP Catalyst Studio — 轻量化 DFT 自动化:POSCAR+用户INCAR → 输入四件套 / 多集群提交 / 零token监控 / LLM分析"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "PyYAML>=6.0",
    "paramiko>=3.0",
    "keyring>=24.0",
]

[project.optional-dependencies]
# GUI 运行(默认 Web 入口需 pywebview;旧版 tkinter 用标准库 tkinter,无需额外声明)
gui = ["pywebview>=4"]
# 打包单文件 EXE
packaging = ["pyinstaller>=6"]
# 原生论文级出图引擎(external/native_charts.py;函数内延迟 import,core 零重依赖)
charts = ["matplotlib>=3.6", "numpy>=1.23"]
# 开发:测试 + 覆盖率 + lint + ASE(解析器交叉校验对拍,可选;缺失则相关测试 skip)
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4", "ase>=3.22"]

[project.urls]
Repository = "https://github.com/2067169120-png/vasp-catalyst-studio-v3"

[project.scripts]
vcs = "vcstudio.cli.main:main"
vcs-gui = "vcstudio.gui.app:main"

[tool.setuptools.packages.find]
include = ["vcstudio*"]

[tool.setuptools.dynamic]
version = {attr = "vcstudio.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

# 保守规则集:pyflakes(F,未用导入/未定义名)+ pycodestyle 错误类(E)。
# 存量代码已满足此集(仅修了 3 处未用导入 + 2 处 E741)。
# 更严的 isort(I)/bugbear(B) 会命中 ~80 处存量风格问题,留作后续专项清理再开启。
[tool.ruff.lint]
select = ["E", "F"]
# E501 行宽不强制报错(存量长行较多,line-length 仅作格式化目标)
ignore = ["E501"]
